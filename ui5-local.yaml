specVersion: "3.1"
metadata:
  name: com.incresolz_inc_plms
type: application
framework:
  name: SAPUI5
  version: 1.79.0
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.ui.layout
    - name: sap.ushell
    - name: sap.collaboration
    - name: sap.ui.comp
    - name: sap.suite.ui.commons
    - name: sap.uxap
    - name: sap.f
    - name: sap.ndc
    - name: sap.ui.generic.app
    - name: sap.ui.table
    - name: themelib_sap_belize
    - name: themelib_sap_bluecrystal
    - name: themelib_sap_fiori_3
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: true
        backend:
          - path: /sap
            url: "https://fmiquaapp:8443"
            client: "300"
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: com.incresolZ_INC_PLMS
        ui5Theme: sap_fiori_3
