specVersion: "3.1"
metadata:
  name: com.incresolz_inc_plms
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        backend:
          - path: /sap
            url: "https://s4hana2022.incresol.com:44300"
            destination: S4H,
            client: "200"
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
          version: 1.38.59
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: com.incresolZ_INC_PLMS
        ui5Theme: sap_fiori_3
